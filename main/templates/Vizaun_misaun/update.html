{% extends "portal/main.html" %}
{% load crispy_forms_tags %}
{% load static %}
{% load sbr_id_jms %}
{% load i18n %}
{% block content %}

<!-- page content -->
<div class="right_col" role="main">
    <div class="">
        <div class="clearfix"></div>
        <div class="row">
            <div class="col-md-12 col-xs-12">
                <div class="x_panel">
                    <div class="x_title">
                        <span class="lapiz-style">
                            <i class="fa fa-edit"></i> 
                            <i class="fa fa-angle-right"></i> Hadia Formulariu Perfil
                        </span>
                        <ul class="nav navbar-right panel_toolbox">
                            <li><a class="collapse-link"><i class="fa fa-chevron-up"></i></a></li>
                        </ul>
                        <div class="clearfix"></div>
                    </div>
                    <div class="x_content">
                        <div class="custom-wrapper">
                           

                            <form method="post" class="form-horizontal form-label-left">
                                {% csrf_token %}
                                {% crispy form %}
                                <div class="ln_solid"></div>
                            </form>
                        </div> <!-- custom-wrapper -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Tautkan file CSS -->
<style>
    /* Estilo ba Input Forms */
    input, select, textarea {
        width: 100%;
        padding: 7px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }
</style>
{% endblock %}
