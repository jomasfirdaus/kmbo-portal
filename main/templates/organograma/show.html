{% extends "portal/kmbomenu.html" %} 
{% load crispy_forms_tags %} 
{% block konteudu1 %} 
{% load i18n %}
<main id="main">

  <!-- ======= Breadcrumbs ======= -->
  <section id="breadcrumbs" class="breadcrumbs">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h2>{% trans "Kona-ba Ami" %}</h2>
        <ol>
          <li><a href="{% url 'dashboardkmbo' %}">{% trans "Baranda" %}</a></li>
          <li>{% trans "Organograma" %}</li>
        </ol>
      </div>
    </div>
  </section><!-- End Breadcrumbs -->

  <!-- ======= About Us Section ======= -->
  <section id="about-us" class="about-us">
    <div class="container" data-aos="fade-up">

      <div class="row content">
        <div class="col-lg-12" data-aos="fade-up" data-aos-delay="100">
            {% for dados in organograma %}
           <center><img src="{{dados.imajen.url}}" class="img-fluid" data-aos="zoom-out" data-aos-delay="20" style="margin-center: 30%; "></center> 
          {% endfor %}
        </div>
      </div>
    </div>
  </section><!-- End About Us Section -->

</main><!-- End #main -->
{% endblock %}
