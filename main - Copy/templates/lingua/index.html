{% extends "portal/main.html" %} {% load crispy_forms_tags %} {% block content %}{% load i18n %}



<main id="main" class="main">

    <section class="section">
        <h1 align="center">Lingua </h1>

    </section>
    <!-- End Page Title -->

    <section class="section">
        <div class="row">
            <div class="col-lg-12">

                <div class="card">
                    <div class="card-body">
                        <br>
                        
                        {% for message in messages %}
      <div id="alert-container" class="alert alert-{{ message.tags }}" role="alert">
          {{ message }}
      </div>
      {% endfor %}

                        <a href="{% url 'inputlingua' %}"><button class="btn btn-success">Rejistu<i class='icon fa-plus icon-white'></i></button></a>

                        <button type="button" class="btn btn-secondary m-1" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
              <span class="tf-icons bx bx-search"> </span>   Peskiza 
              </button>
                    </div>

                </div>

                <table cellpadding='0' cellspacing='0' border='0' class='table table-striped table-bordered' id='example2'>
                    <thead>
                        <tr>

                            <th width="2%">Nu</th>

                            <th width="10%">Lingua</th>

                            <th width="4%">Asaun</th>
                        </tr>
                    </thead>
                    <tbody>

                        {% for dados in lingua %}

                        <tr>
                            <td>{{forloop.counter}}</td>
                            <td>{{dados.naran}}</td>


                            <td>

                                <a href="{% url 'update' id=dados.id %}" class="btn-danger btn">Hadia</a>
                                <a href="{% url 'hamos' id=dados.id %}" onclick="return confirm('Ita Boot hakarak apaga dados ?')" class="btn btn-warning"> Hamos</a>

                            </td>

                        </tr>

                        {% endfor %}
                    </tbody>
                </table>

            </div>
        </div>

        </div>
        </div>
        </div>
        </div>

        <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="staticBackdropLabel">Peskiza Dadus</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <form method="get" action="">

                        <div class="modal-body">

                            <input type="text" class="form-control" name="pesquiza" placeholder="Prenxe Liafuan">

                        </div>


                        <div class="modal-footer">
                            <button type="submit" class="btn btn-secondary" data-bs-disxmiss="modal">Peskiza</buttom>
        </div>
  
      </form>
  
      </div>
    </div>
  </div>

  {% endblock %}
