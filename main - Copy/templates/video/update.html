{% extends "portal/main.html" %}
{% load crispy_forms_tags %}
{% load static %}
{% load sbr_id_jms %}
{% load i18n %}

{% block content %}
<!-- page content -->
<div class="right_col" role="main">
  <div class="clearfix"></div>
  <div class="row">
    <div class="col-md-12 col-sm-12 col-xs-12">
      <div class="x_panel">
        <div class="x_title">
            <h2><i class="fa fa-edit"></i> <span class="lapiz-style">Video</span></h2>
            <ul class="nav navbar-right panel_toolbox">
                <li><a class="collapse-link"><i class="fa fa-chevron-up"></i></a></li>
                <li><a class="close-link"><i class="fa fa-close"></i></a></li>
            </ul>
            <div class="clearfix"></div>
        </div>
        <div class="x_content">
            <br />
            <div class="card-content">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }} 
                    <div class="button-container text-center"><br>
                            <button class="btn btn-xs btn-info" type="submit" id="submit-btn">
                                <i class="fa fa-edit"></i> Atuliza
                            </button>
                            <a class="btn btn-xs btn-danger" href="javascript:history.back();" id="cancel-btn">
                                <i class="fa fa-close"></i> Kansela
                            </a>
                        </div>                            
                    </form>
                </div> <!-- end div tambahan -->
              </div>
          </div>
        </div>
      </div>
    </div>
    </div>
    {% endblock %}
