{% extends "portal/main.html" %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block content %}
<div class="right_col" role="main">
  <div class="container">
    <div class="clearfix"></div>
    <div class="row">
      <div class="col-md-12 col-xs-12">
        <div class="x_panel">
          <div class="x_title">
            <h2>
              <i class="fa fa-plus-circle"></i>
              <span class="lapiz-style"> Parseira Sira</span>
            </h2>
            <ul class="nav navbar-right panel_toolbox">
              <li><a class="collapse-link"><i class="fa fa-chevron-up"></i></a></li>
              <li><a class="close-link"><i class="fa fa-close"></i></a></li>
            </ul>
            <div class="clearfix"></div>
          </div>
          <div class="x_content">
            <div class="card">
              <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                  {% csrf_token %}
                  {{ form|crispy }}
                  <div class="form-group text-center mt-3">
                    <button class="btn btn-info btn-xs" type="submit" id="submit-btn">
                      <i class="fa fa-save"></i> Submete
                    </button>
                    <a class="btn btn-danger btn-xs" href="javascript:history.back();" id="cancel-btn">
                      <i class="fa fa-close"></i> Kansela
                    </a>
                  </div>
                </form>
              </div> <!-- /.card-body -->
            </div> <!-- /.card -->
          </div> <!-- /.x_content -->
        </div> <!-- /.x_panel -->
      </div> <!-- /.col -->
    </div> <!-- /.row -->
  </div> <!-- /.container -->
</div> <!-- /.right_col -->
{% endblock %}
